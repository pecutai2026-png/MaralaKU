# Membuat APK MaralaKU di GitHub (tanpa perlu Android Studio di komputer).
# Berjalan otomatis saat folder android/ berubah, atau manual lewat tab Actions → "Build APK Android" → Run workflow.
# Hasil: file APK di halaman Releases (tag android-terbaru) dan di Artifacts pada setiap run.
name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Opsional tapi disarankan: kunci tanda tangan tetap (lihat android/README.md).
      # Tanpa kunci ini, APK tetap jadi, tetapi versi baru harus dipasang setelah versi lama dihapus.
      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.MARALA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/marala.jks"
            echo "MARALA_KEYSTORE=$RUNNER_TEMP/marala.jks" >> "$GITHUB_ENV"
            echo "Memakai kunci tanda tangan dari Secrets."
          else
            echo "::warning::Secret MARALA_KEYSTORE_BASE64 belum diisi; APK ditandatangani kunci sementara."
          fi

      - name: Build APK
        working-directory: android
        env:
          MARALA_KEYSTORE_PASSWORD: ${{ secrets.MARALA_KEYSTORE_PASSWORD }}
          MARALA_KEY_ALIAS: ${{ secrets.MARALA_KEY_ALIAS }}
          MARALA_KEY_PASSWORD: ${{ secrets.MARALA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Beri nama file
        run: cp android/app/build/outputs/apk/release/app-release.apk MaralaKU.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MaralaKU-apk
          path: MaralaKU.apk

      - name: Terbitkan di Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-terbaru --yes --cleanup-tag || true
          gh release create android-terbaru MaralaKU.apk \
            --title "MaralaKU Android (terbaru)" \
            --notes "APK dibuat otomatis dari commit ${GITHUB_SHA::7}. Unduh MaralaKU.apk di HP Android, buka, lalu pilih Pasang. Jika muncul peringatan sumber tidak dikenal, izinkan pemasangan dari browser/File Manager." \
            --target "$GITHUB_SHA"
